<!DOCTYPE html>
<html>
<body>

    <h2>Square Calculator</h2>
    <p id="square-result"></p>

    <script>
        // Function to calculate the square
        function findSquare(num) {
            return num * num;
        }

        // Example: Finding the square of 8
        let number = 8;
        let result = findSquare(number);
        
        // Displaying the result on the page
        document.getElementById("square-result").innerHTML = 
            "The square of " + number + " is: " + result;
    </script>

</body>
</html>
