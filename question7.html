<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h2>Simple Calculator (Using Switch)</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="text" id="operator" placeholder="Enter operator (+, -, *, /)">    
    <button onclick="calculate()">Calculate</button>
    <p id="result"></p>
    <script>
        function calculate() {
            var n1 = document.getElementById("num1").value;
            var n2 = document.getElementById("num2").value;
            var op = document.getElementById("operator").value;
            if (n1 === "" || n2 === "" || op === "") {
                document.getElementById("result").innerHTML = "Please enter all fields";
                return;
            }
            n1 = parseFloat(n1);
            n2 = parseFloat(n2);
            var result;
            switch (op) {
                case "+":
                    result = n1 + n2;
                    break;
                case "-":
                    result = n1 - n2;
                    break;
                case "*":
                    result = n1 * n2;
                    break;
                case "/":
                    if (n2 === 0) {
                        document.getElementById("result").innerHTML = "Cannot divide by zero";
                        return;
                    }
                    result = n1 / n2;
                    break;
                default:
                    document.getElementById("result").innerHTML = "Invalid operator";
                    return;
            }
            document.getElementById("result").innerHTML = "Result: " + result;
        }
    </script>
</body>
</html>
