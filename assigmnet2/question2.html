<!DOCTYPE html>
<html>
<head>
    <title>Even Numbers</title>
</head>
<body>
    <h2>Even Numbers from 1 to 20:</h2>
    <p id="result"></p>
    <script>
        let output = "";

        for (let i = 2; i <= 20; i += 2) {
            output += i + "<br>";
        }
        document.getElementById("result").innerHTML = output;
    </script>
</body>
</html>
