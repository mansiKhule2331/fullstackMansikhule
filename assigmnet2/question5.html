<!DOCTYPE html>
<html>
<head>
    <title>Sum of First 10 Natural Numbers</title>
</head>
<body>

    <h2>Sum of First 10 Natural Numbers</h2>
    <p id="result"></p>

    <script>
        let sum = 0;

        for (let i = 1; i <= 10; i++) {
            sum += i;
        }

        document.getElementById("result").innerHTML = 
            "Sum of first 10 natural numbers is: " + sum;
    </script>

</body>
</html>
