<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <h2>Multiplication Table of 5</h2>
    <p id="result"></p>
    <script>
        let number = 5;
        let output = "";

        for (let i = 1; i <= 10; i++) {
            output += number + " x " + i + " = " + (number * i) + "<br>";
        }
        document.getElementById("result").innerHTML = output;
    </script>
</body>
</html>
