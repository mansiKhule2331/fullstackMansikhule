<!DOCTYPE html>
<html>
<head>
    <title>Powers of 2</title>
</head>
<body>

    <h2>Powers of 2 less than 100</h2>
    <p id="result"></p>

    <script>
        let number = 2;
        let output = "";

        while (number < 100) {
            output += number + "<br>";
            number = number * 2;
        }

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
