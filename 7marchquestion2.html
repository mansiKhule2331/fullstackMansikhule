<!DOCTYPE html>
<html>
<head>
    <title>Skip Multiples of 10</title>
</head>
<body>

<h2>Numbers from 1 to 50 (Skipping multiples of 10)</h2>

<button onclick="showNumbers()">Show Numbers</button>

<p id="result"></p>

<script>
function showNumbers() {

    var output = "";

    for (var i = 1; i <= 50; i++) {

        if (i % 10 === 0) {
            continue;   // Skip multiples of 10
        }

        output = output + i + " ";
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
