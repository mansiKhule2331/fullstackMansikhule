<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Modern Layout</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #1f2937; line-height: 1.6; }
        .container { max-width: 1100px; margin: 50px auto; padding: 20px; }        
        /* Flexbox Wrapper */
        .contact-wrapper {
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on mobile */
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        /* Form and Map Sections */
        .form-section, .map-section {
            width: 100%; /* Default 100% for mobile */
            padding: 40px;
        }
        /* Desktop Layout: Side-by-Side */
        @media (min-width: 768px) {
            .form-section, .map-section {
                width: 50%; /* Stays at 50% on wide screens */
            }
        }
        /* Form Styling */
        h2 { margin-bottom: 20px; font-size: 1.8rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background: #1d4ed8; }
        /* Map Section Styling */
        .map-section {
            background: #e5e7eb;
            padding: 0; /* Remove padding to make map flush */
            min-height: 300px;
        }
        .map-section iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="contact-wrapper">
            <!-- Contact Form -->
            <div class="form-section">
                <h2>Get in Touch</h2>
                <form>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com">
                    </div>
                    <div class="input-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="How can we help?"></textarea>
                    </div>
                    <button type="submit">Send Message</button>
                </form>
            </div>
            <!-- Embedded Map -->
            <div class="map-section">
                <!-- Replace URL with your actual Google Maps embed link -->
                <iframe src="../google.png" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
