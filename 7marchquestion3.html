<!DOCTYPE html>
<html>
<head>
    <title>String Reverse Program</title>
</head>
<body>

<h2>Reverse String (Replace Space with -)</h2>

<input type="text" id="text" placeholder="Enter a string">
<button onclick="reverseString()">Reverse</button>

<p id="result"></p>

<script>
function reverseString() {

    var str = document.getElementById("text").value;
    var output = "";

    for (var i = str.length - 1; i >= 0; i--) {

        if (str[i] === " ") {
            output += "-";
        } 
        else {
            output += str[i];
        }

    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
