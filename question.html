<!DOCTYPE html>
<html>
<head>
    <title>Greeting Page</title>
</head>
<body>

    <button onclick="greet()">Click Me</button>

    <script>
        // The function definition
        function greet() {
            console.log("Hello, World!"); // Prints to the browser console
            alert("Hello, World!");      // Shows a pop-up window
        }
    </script>

</body>
</html>
