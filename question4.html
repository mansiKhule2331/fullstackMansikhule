<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Pricing Table</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; padding: 40px 20px; }
        /* Flexbox Container */
        .pricing-wrapper {
            display: flex;
            flex-direction: column; /* Mobile first: Vertical stack */
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        /* Desktop Layout (Wide Screens) */
        @media (min-width: 768px) {
            .pricing-wrapper {
                flex-direction: row; /* Horizontal row */
                justify-content: center;
                align-items: stretch;
            }
        }
        /* Individual Card Styles */
        .pricing-card {
            flex: 1;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .pricing-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        /* Highlight the Pro plan */
        .pro-plan { border: 2px solid #007bff; position: relative; }
        .badge { background: #007bff; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); }
        .price { font-size: 2.5rem; font-weight: bold; margin: 20px 0; }
        .price span { font-size: 1rem; color: #666; }
        .features { list-style: none; padding: 0; margin-bottom: 25px; color: #555; }
        .features li { margin: 10px 0; }
        .btn { display: block; background: #333; color: #fff; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; }
        .pro-btn { background: #007bff; }
    </style>
</head>
<body>
    <div class="pricing-wrapper">
        <!-- Basic Plan -->
        <div class="pricing-card">
            <h3>Basic</h3>
            <div class="price">$19<span>/mo</span></div>
            <ul class="features">
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>1GB Storage</li>
            </ul>
            <a href="#" class="btn">Get Started</a>
        </div>
        <!-- Pro Plan (Featured) -->
        <div class="pricing-card pro-plan">
            <div class="badge">Most Popular</div>
            <h3>Pro</h3>
            <div class="price">$49<span>/mo</span></div>
            <ul class="features">
                <li>Unlimited Projects</li>
                <li>Priority Support</li>
                <li>10GB Storage</li>
            </ul>
            <a href="#" class="pro-btn btn">Get Pro</a>
        </div>
        <!-- Premium Plan -->
        <div class="pricing-card">
            <h3>Premium</h3>
            <div class="price">$99<span>/mo</span></div>
            <ul class="features">
                <li>Enterprise Access</li>
                <li>Dedicated Manager</li>
                <li>Unlimited Storage</li>
            </ul>
            <a href="#" class="btn">Contact Sales</a>
        </div>
    </div>

</body>
</html>
