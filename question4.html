<!DOCTYPE html>
<html>
<head>
    <title>Compare Two Numbers</title>
</head>
<body>
    <h2>Find the Larger Number</h2>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <button onclick="compareNumbers()">Compare</button>
    <p id="result"></p>
    <script>
        function compareNumbers() {
            var n1 = document.getElementById("num1").value;
            var n2 = document.getElementById("num2").value;
            if (n1 === "" || n2 === "") {
                document.getElementById("result").innerHTML = "Please enter both numbers";
                return;
            }
            n1 = parseInt(n1);
            n2 = parseInt(n2);
            if (n1 > n2) {
                document.getElementById("result").innerHTML = "Larger number is: " + n1;
            }
            else if (n2 > n1) {
                document.getElementById("result").innerHTML = "Larger number is: " + n2;
            }
            else {
                document.getElementById("result").innerHTML = "Both numbers are equal";
            }
        }
    </script>
</body>
</html>
