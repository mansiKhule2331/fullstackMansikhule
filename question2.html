<!DOCTYPE html>
<html>
<body>

    <h2>Sum Calculator</h2>
    <p id="result">Result will appear here.</p>

    <script>
        // The requested function
        function add(a, b) {
            return a + b;
        }

        // Example: Calling the function and showing it on the page
        let sum = add(10, 25);
        document.getElementById("result").innerHTML = "The sum is: " + sum;
    </script>

</body>
</html>
